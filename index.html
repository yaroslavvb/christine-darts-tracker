<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>2970 Christine darts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts">
<meta name="theme-color" content="#14161a">
<style>
  :root{
    --bg:#14161a;
    --panel:#1c1f26;
    --panel2:#232732;
    --line:#333846;
    --text:#e9ecf2;
    --dim:#9aa3b2;
    --accent:#ffc247;
    --green:#31c26a;
    --red:#e0454f;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
    min-height:100dvh;display:flex;flex-direction:column;
  }
  button{font:inherit;color:inherit;cursor:pointer}

  header{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#1b1f27,#171a21);
    position:sticky;top:0;z-index:20;
  }
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
  h1 .em{color:var(--accent)}
  /* in full screen the chrome shrinks so the board gets the pixels */
  body.isFull header{padding:5px 12px}
  body.isFull h1{font-size:15px}
  body.isFull .btn,body.isFull select{padding:7px 11px;font-size:14px}
  .spacer{flex:1}
  .btn{
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:11px 15px;font-size:15px;font-weight:600;white-space:nowrap;
  }
  .btn{transition:transform .06s ease,background .08s ease,box-shadow .08s ease}
  .btn:active,.btn.hit{
    background:var(--accent);color:#20160a;border-color:#e0a92e;transform:scale(.95);
    box-shadow:0 0 0 4px rgba(255,194,71,.3);
  }
  .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{background:var(--accent);color:#20160a;border-color:#e0a92e}
  .btn.ghost{background:transparent}
  .btn.danger{color:#ffb3b8}
  select{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;
  }

  /* Board on the left gets every pixel that the scoreboard doesn't need.
     The sidebar caps at a width that fits three players without sideways scrolling. */
  main{
    flex:1 1 auto;min-height:0;
    display:grid;gap:12px;padding:12px;
    grid-template-columns:minmax(0,1fr) minmax(300px,540px);
    align-items:stretch;
  }
  @media (max-width:900px){
    main{grid-template-columns:1fr;align-items:start}
    /* stacked: let the scoreboard scroll inside itself instead of growing the page forever */
    #sbScroll{max-height:65vh}
  }
  @media (min-width:901px){
    body{height:100dvh;overflow:hidden}
    #sidebar{min-height:0}
    #sbScroll{flex:1 1 auto;min-height:0}
  }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  #sidebar{display:flex;flex-direction:column}
  .panel-h{
    display:flex;align-items:center;gap:8px;
    padding:9px 12px;border-bottom:1px solid var(--line);
    font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700;
  }

  /* ---------- board ---------- */
  /* Nothing but the board in here — no frame, no caption, no controls. */
  #boardPane{
    display:flex;align-items:center;justify-content:center;
    min-width:0;min-height:0;
  }
  svg#board{
    display:block;touch-action:none;cursor:crosshair;
    width:100%;height:auto;
  }
  @media (min-width:901px){
    svg#board{height:100%;min-height:0}
  }

  /* ---------- keypad (alternative to the board) ---------- */
  #keypad{display:none;flex-direction:column;gap:5px;width:100%;height:100%;min-height:0}
  body.mode-keypad #board{display:none}
  body.mode-keypad #keypad{display:flex}
  body.mode-keypad #boardPane{align-items:stretch}
  @media (max-width:900px){ #keypad{min-height:64vh} }

  /* small gaps: every pixel between buttons is a pixel that swallows a press */
  #kpNums{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);
          gap:5px;flex:1 1 auto;min-height:0}
  #kpBull{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:0 0 auto}
  #kpMult{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;flex:0 0 auto}

  .kp{
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-weight:800;color:var(--text);line-height:1;padding:6px;min-height:56px;
    touch-action:none;                 /* no tap delay, no gesture stealing the press */
    transition:transform .05s ease,background .07s ease,box-shadow .07s ease;
  }
  /* unmistakable: the whole button goes accent and punches in for ~170ms */
  .kp:active,.kp.hit{
    background:var(--accent);border-color:#ffd77a;color:#20160a;transform:scale(.93);
    box-shadow:0 0 0 5px rgba(255,194,71,.4);
  }
  .kp.hit .big,.kp.hit .lbl,.kp.hit .sub,
  .kp:active .big,.kp:active .lbl,.kp:active .sub{color:#20160a}
  .kp:disabled{opacity:.35;cursor:default}
  .kp:disabled.hit{background:var(--panel2);transform:none;box-shadow:none}
  .kp .big{font-size:clamp(20px,3.4vw,34px)}
  .kp .sub{font-size:clamp(10px,1.3vw,14px);font-weight:700;color:var(--accent);opacity:.9;
           max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kp .lbl{font-size:clamp(11px,1.4vw,15px);font-weight:700;color:var(--dim)}
  /* modifiers, not scores — tinted so they read differently from the number pad */
  #kpMult .kp{background:#262114;border-color:#4b4531}
  #kpMult .kp .big{color:var(--accent);font-size:clamp(22px,3.8vw,38px)}
  #kpMult .kp:active{background:#332c1a}
  /* fixed heights, not min-heights: nothing inside these rows may ever change the row
     height, or the flex:1 number grid resizes and the keypad shifts under your finger */
  #kpBull .kp{height:74px;min-height:0;overflow:hidden}
  #kpMult .kp{height:84px;min-height:0;overflow:hidden}
  #kpBull .kp.bull .big{color:var(--red)}
  #kpBull .kp.ring .big{color:var(--green)}

  /* ---------- turn strip (top of the sidebar) ---------- */
  #turnbar{
    display:flex;flex-direction:column;gap:10px;
    padding:12px;border-bottom:1px solid var(--line);background:var(--panel2);
  }
  #whoseTurn{font-weight:750;font-size:25px;display:flex;align-items:baseline;gap:10px;min-width:0}
  #whoseTurn .nm{color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #whoseTurn .togo{color:var(--dim);font-size:20px;font-weight:700;white-space:nowrap}
  .tb-actions{display:flex;gap:8px}
  .tb-actions .btn{flex:1}
  .darts{display:flex;gap:8px}
  .slot{
    flex:1;min-width:0;height:56px;border-radius:11px;border:1px dashed var(--line);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:24px;color:var(--dim);background:#191c23;
  }
  .slot.filled{border-style:solid;border-color:#4a5165;color:var(--text);background:#2b3140}
  .slot .mult{font-size:16px;color:var(--accent);margin-right:3px}

  /* ---------- scoreboard ---------- */
  /* deliberately not smooth: the table is rebuilt on every dart, so an animated
     reposition would visibly glide from the top each time */
  #sbScroll{overflow:auto}
  table{border-collapse:collapse;width:100%;table-layout:fixed;font-variant-numeric:tabular-nums}
  th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
  th:last-child,td:last-child{border-right:0}
  thead th{
    position:sticky;top:0;z-index:5;background:var(--panel2);
    padding:8px 8px 10px;vertical-align:top;
  }
  th.turncol,td.turncol{
    width:44px;text-align:center;color:var(--dim);font-size:15px;font-weight:700;
    background:#191c23;
  }
  td.turncol{padding:8px 0}
  .phead{display:flex;flex-direction:column;gap:5px;align-items:stretch}
  .phead-top{display:flex;align-items:center;gap:6px}
  .pname{
    flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed transparent;
    color:var(--text);font:650 19px/1.2 inherit;padding:2px 0;
  }
  .pname:focus{outline:none;border-bottom-color:var(--accent)}
  .px{
    background:transparent;border:0;color:#6d7688;font-size:20px;line-height:1;
    padding:4px 9px;border-radius:6px;
  }
  .px:hover{color:var(--red)}
  .ptotal{font-size:52px;font-weight:800;line-height:1;letter-spacing:-1.5px}
  .ptogo{font-size:15px;color:var(--dim);font-weight:600}
  th.active{box-shadow:inset 0 3px 0 var(--accent)}
  th.active .ptotal{color:var(--accent)}
  .place{font-size:15px;font-weight:800;color:var(--green)}

  @media (max-width:620px){
    main{padding:8px;gap:10px}
    #boardWrap{padding:3px}
    .ptotal{font-size:38px;letter-spacing:-1px}
    .ptogo,.place{font-size:13px}
    .pname{font-size:17px}
    .trun{font-size:26px}
    .tscore{font-size:17px;min-width:38px}
    .tdarts{font-size:12.5px}
    thead th{padding:8px 8px 10px}
    td.cell{padding:7px 8px}
  }

  td.cell{padding:8px 10px;vertical-align:top;height:1px}
  .turncell{display:flex;align-items:baseline;gap:8px}
  .tscore{
    font-size:19px;font-weight:800;color:var(--dim);min-width:44px;
  }
  .tscore.pos{color:var(--green)}
  .tscore.bust{color:var(--red)}
  .trun{font-size:32px;font-weight:750;margin-left:auto;line-height:1.05}
  .tdarts{font-size:14px;color:#7d879a;letter-spacing:.02em;margin-top:3px;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ptotal,.ptogo,.place{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tr.live td.cell{background:#20242e}
  .livedots{color:var(--accent);font-weight:800;font-size:17px}

  /* ---------- toast / banner ---------- */
  #toast{
    position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);
    background:#000d;backdrop-filter:blur(6px);border:1px solid var(--line);
    padding:12px 22px;border-radius:999px;font-weight:750;font-size:22px;
    opacity:0;pointer-events:none;transition:.18s;z-index:60;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bust{border-color:var(--red);color:#ffb3b8}
  #toast.win{border-color:var(--green);color:#b6f5cf}

  #banner{
    display:none;margin:0 14px;padding:12px 14px;border-radius:var(--radius);
    background:linear-gradient(90deg,#1e3a2a,#1c1f26);border:1px solid #2c6b45;
  }
  #banner.on{display:block}
  #banner h2{margin:0 0 6px;font-size:16px}
  #banner ol{margin:0;padding-left:20px;color:var(--dim);font-size:14px}
  #banner b{color:var(--text)}

</style>
</head>
<body>

<header>
  <h1>🎯 2970 Christine <span class="em">darts</span></h1>
  <div class="spacer"></div>
  <select id="targetSel" title="Target score">
    <option value="300">to 300</option>
    <option value="301">to 301</option>
    <option value="501">to 501</option>
    <option value="1000">to 1000</option>
  </select>
  <button class="btn" id="modeBtn">⌨ Keypad</button>
  <button class="btn" id="addPlayer">+ Player</button>
  <button class="btn ghost" id="undo">↶ Undo</button>
  <button class="btn ghost" id="soundBtn" title="Sound and vibration">🔊</button>
  <button class="btn ghost" id="fullBtn" title="Full screen">⛶ Full screen</button>
  <button class="btn ghost" id="newGame">New game</button>
</header>

<div id="banner"></div>

<main>
  <section id="boardPane">
    <svg id="board" viewBox="-228 -228 456 456" aria-label="Dartboard"></svg>
    <div id="keypad" aria-label="Score keypad">
      <div id="kpNums"></div>
      <div id="kpBull"></div>
      <div id="kpMult"></div>
    </div>
  </section>

  <section class="panel" id="sidebar">
    <div id="turnbar">
      <div id="whoseTurn"></div>
      <div class="darts" id="dartSlots"></div>
      <div class="tb-actions">
        <button class="btn" id="missBtn">Miss (0)</button>
        <button class="btn" id="endTurn">End turn ▸</button>
      </div>
    </div>
    <div class="panel-h"><span>Scoreboard</span><span class="spacer"></span><span id="turnCount"></span></div>
    <div id="sbScroll"><table id="sb"></table></div>
  </section>
</main>

<div id="toast"></div>

<script>
(function(){
"use strict";

/* ============================ dartboard geometry ============================ */
const SECTORS = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
// Deliberately NOT a real board's proportions. A regulation treble ring is 8mm wide —
// on a tablet that is thinner than a fingertip, so it is unhittable. Every ring here is
// ~4x thicker than the real thing and the bull is enormous. The rings still sit in the
// same order at roughly the same fractions of the radius, so it reads as a dartboard.
const R = { bull:34, outerBull:58, trebleIn:100, trebleOut:132, doubleIn:162, doubleOut:194, numbers:207, surround:222 };
const C = { black:'#191919', cream:'#efe2c0', red:'#cf2027', green:'#17904b', wire:'#9aa0aa' };

const svg = document.getElementById('board');
const SVGNS = 'http://www.w3.org/2000/svg';

function el(name, attrs, parent){
  const n = document.createElementNS(SVGNS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
// angle in degrees measured clockwise from 12 o'clock
function pt(r, deg){
  const a = deg * Math.PI/180;
  return [ +(r*Math.sin(a)).toFixed(3), +(-r*Math.cos(a)).toFixed(3) ];
}
function wedge(r0, r1, a0, a1){
  const [x1,y1]=pt(r1,a0), [x2,y2]=pt(r1,a1), [x3,y3]=pt(r0,a1), [x4,y4]=pt(r0,a0);
  return `M${x1},${y1}A${r1},${r1} 0 0 1 ${x2},${y2}L${x3},${y3}A${r0},${r0} 0 0 0 ${x4},${y4}Z`;
}

function buildBoard(){
  const g = el('g', {id:'boardG'}, svg);
  el('circle', {cx:0, cy:0, r:R.surround, fill:'#101216'}, g);
  el('circle', {cx:0, cy:0, r:(R.doubleOut+R.surround)/2, fill:'none', stroke:'#0b0c0f',
                'stroke-width':R.surround-R.doubleOut}, g);

  for (let i=0;i<20;i++){
    const a0 = i*18-9, a1 = i*18+9;
    const dark = (i%2===0);
    const single = dark ? C.black : C.cream;
    const ring   = dark ? C.red   : C.green;
    const mk = (r0,r1,fill)=> el('path', {d:wedge(r0,r1,a0,a1), fill, stroke:C.wire,
                                          'stroke-width':0.7, 'stroke-opacity':0.55}, g);
    mk(R.outerBull, R.trebleIn,  single);
    mk(R.trebleIn,  R.trebleOut, ring);
    mk(R.trebleOut, R.doubleIn,  single);
    mk(R.doubleIn,  R.doubleOut, ring);
  }
  el('circle', {cx:0, cy:0, r:R.outerBull, fill:C.green, stroke:C.wire, 'stroke-width':0.7, 'stroke-opacity':0.55}, g);
  el('circle', {cx:0, cy:0, r:R.bull,      fill:C.red,   stroke:C.wire, 'stroke-width':0.7, 'stroke-opacity':0.55}, g);

  for (let i=0;i<20;i++){
    const [x,y] = pt(R.numbers, i*18);
    const t = el('text', {x, y, fill:'#f2f5fa', 'font-size':27, 'font-weight':800,
                          'text-anchor':'middle', 'dominant-baseline':'central',
                          'font-family':'inherit'}, g);
    t.textContent = SECTORS[i];
  }
  return g;
}
buildBoard();

// markers for darts thrown this turn
const markerG = el('g', {id:'markers'}, svg);

// magnifier
const magG = el('g', {id:'mag', display:'none'}, svg);
const MAG_R = 50, MAG_ZOOM = 2.0, MAG_LIFT = 112;   // loupe radius / zoom / offset above the finger
const clip = el('clipPath', {id:'magClip', clipPathUnits:'userSpaceOnUse'}, magG);
const clipC = el('circle', {cx:0, cy:0, r:MAG_R}, clip);
const magInnerWrap = el('g', {'clip-path':'url(#magClip)'}, magG);
const magBg = el('circle', {cx:0, cy:0, r:MAG_R, fill:'#101216'}, magInnerWrap);
const magInner = el('g', {}, magInnerWrap);
el('use', {href:'#boardG', 'xlink:href':'#boardG'}, magInner);
const magRing = el('circle', {cx:0, cy:0, r:MAG_R, fill:'none', stroke:'#fff', 'stroke-width':2.5,
                              'stroke-opacity':.85}, magG);
const magCrossA = el('line', {stroke:'#fff','stroke-width':1.6,'stroke-opacity':.9}, magG);
const magCrossB = el('line', {stroke:'#fff','stroke-width':1.6,'stroke-opacity':.9}, magG);
const magLabelBg = el('rect', {rx:9, fill:'#000', 'fill-opacity':.82, stroke:'#fff','stroke-opacity':.35}, magG);
const magLabel = el('text', {fill:'#fff','font-size':22,'font-weight':800,'text-anchor':'middle',
                             'dominant-baseline':'central','font-family':'inherit'}, magG);
const liveDot = el('circle', {r:3.2, fill:'#fff', stroke:'#000', 'stroke-width':1}, magG);

/* ============================ scoring ============================ */
function scoreAt(x, y){
  const r = Math.hypot(x, y);
  if (r <= R.bull)      return {sector:25, mult:2, value:50, label:'BULL 50', short:'BULL'};
  if (r <= R.outerBull) return {sector:25, mult:1, value:25, label:'25',      short:'25'};
  if (r >  R.doubleOut) return {sector:0,  mult:0, value:0,  label:'MISS 0',  short:'–'};
  let a = Math.atan2(x, -y) * 180/Math.PI;
  if (a < 0) a += 360;
  const s = SECTORS[Math.floor((a + 9) / 18) % 20];
  let mult = 1;
  if (r >= R.trebleIn && r <= R.trebleOut) mult = 3;
  else if (r >= R.doubleIn) mult = 2;
  const short = (mult===3?'T':mult===2?'D':'') + s;
  return {sector:s, mult, value:s*mult, label:`${short} = ${s*mult}`, short};
}

/* ============================ state ============================ */
const KEY = 'christine-darts-v1';
let S = null;
let undoStack = [];

// who actually plays; a fourth or fifth player falls back to "Player N"
const DEFAULT_NAMES = ['Володя','Галя','Ярослав'];
const defaultName = i => DEFAULT_NAMES[i] || ('Player ' + (i+1));

function newPlayer(name){ return {name, total:0, history:[], place:null}; }

function freshGame(names, target){
  return {
    target: target || 300,
    players: (names && names.length ? names : DEFAULT_NAMES.slice()).map(newPlayer),
    cur: 0,
    darts: [],          // {short, value, base, mult, x, y}
    last: null,         // the dart just entered, so x2/x3 can upgrade it
    over: false,
    started: new Date().toISOString()
  };
}

// A game saved before these names existed, still untouched: adopt them, so the
// change shows up instead of being hidden behind a stale "Player 1 / Player 2".
function adoptDefaultNames(){
  const untouched = S.players.every(p => !p.history.length && p.total === 0 && !p.place &&
                                         /^Player \d+$/.test(p.name));
  if (untouched && !S.darts.length) S.players.forEach((p,i)=>{ p.name = defaultName(i); });
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (raw){
      const o = JSON.parse(raw);
      if (o && o.game && Array.isArray(o.game.players)){
        S = o.game;
        // upgrading rewinds through the undo stack, which does not survive a reload
        S.last = null;
        adoptDefaultNames();
        return;
      }
    }
  }catch(e){}
  S = freshGame();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({game:S})); }catch(e){}
}
function snapshot(){
  undoStack.push(JSON.stringify(S));
  if (undoStack.length > 200) undoStack.shift();
}
function undo(){
  const prev = undoStack.pop();
  if (!prev) return;
  S = JSON.parse(prev);
  save(); render();
}

/* ============================ game logic ============================ */
function activePlayers(){ return S.players.filter(p=>!p.place); }

function nextIndex(from){
  const n = S.players.length;
  for (let k=1;k<=n;k++){
    const i = (from + k) % n;
    if (!S.players[i].place) return i;
  }
  return -1;
}

function commitTurn(kind){       // kind: 'normal' | 'bust' | 'win'
  const p = S.players[S.cur];
  const gained = S.darts.reduce((a,d)=>a+d.value,0);
  const bust = (kind === 'bust');
  if (!bust) p.total += gained;
  p.history.push({
    darts: S.darts.map(d=>({short:d.short, value:d.value})),
    score: bust ? 0 : gained,
    total: p.total,
    bust
  });
  if (kind === 'win'){
    p.place = S.players.filter(q=>q.place).length + 1;
  }
  S.darts = [];
  const nxt = nextIndex(S.cur);
  if (nxt === -1) S.over = true;
  else S.cur = nxt;
}

function throwDart(d){
  if (S.over) return;
  if (!S.players.length) return;
  snapshot();
  S.darts.push(d);
  // Remember it so x2 / x3 can rewind and re-enter it multiplied. `by` is who threw it,
  // which matters once a third dart has committed the turn and play has moved on.
  // `stack` stamps how deep the undo stack was, so the rewind can prove the snapshot on
  // top still belongs to this dart — anything else pushing a snapshot in between (adding
  // a player, a new game, changing the target) invalidates the upgrade instead of
  // rewinding into the wrong state and adding a second dart.
  S.last = Object.assign({}, d, {by: S.cur, stack: undoStack.length});
  const p = S.players[S.cur];
  const projected = p.total + S.darts.reduce((a,x)=>a+x.value,0);

  if (projected > S.target){
    commitTurn('bust');
    toast('BUST — turn voided', 'bust');
    fx.bust();
  } else if (projected === S.target){
    commitTurn('win');
    toast(`${p.name} finishes on ${S.target}! 🎉`, 'win');
    fx.win();
  } else if (S.darts.length >= 3){
    commitTurn('normal');
    toast(d.label);
  } else {
    toast(d.label);
  }
  save(); render();
}

function endTurn(){
  if (S.over || !S.players.length) return;
  snapshot();
  if (S.darts.length === 0){
    // nothing thrown — just pass the turn without writing a row
    const nxt = nextIndex(S.cur);
    if (nxt !== -1) S.cur = nxt;
  } else {
    commitTurn('normal');
  }
  S.last = null;              // deliberately ending the turn closes the door on x2 / x3
  save(); render();
}

// Suffix multiplier: the number has already been entered as a single, so rewind to
// just before it and re-enter it as a double or treble. Rewinding means bust, an
// exact finish, and an auto-committed third dart all re-evaluate correctly.
function applyMult(m){
  if (!canUpgrade()) return;
  const last = S.last;
  // deliberately not gated on S.over: a game-ending dart is the one you most want to fix,
  // and rewinding restores the state from before it was won
  S = JSON.parse(undoStack.pop());
  const short = (m===3 ? 'T' : 'D') + last.base;
  throwDart(Object.assign({}, last, {
    short, value: last.base * m, mult: m, label: `${short} = ${last.base * m}`
  }));
}
// Only the 20 numbered beds have doubles and trebles — not the bull, not a miss. And the
// snapshot on top of the undo stack has to still be the one taken for that dart.
function canUpgrade(){
  const d = S.last;
  return !!d && d.base >= 1 && d.base <= 20 && undoStack.length === d.stack;
}

/* ============================ pointer handling ============================ */
let aiming = false;

function toSvg(evt){
  const m = svg.getScreenCTM();
  if (!m) return {x:0,y:0};
  const inv = m.inverse();
  const p = svg.createSVGPoint();
  p.x = evt.clientX; p.y = evt.clientY;
  const q = p.matrixTransform(inv);
  return {x:q.x, y:q.y};
}

function showMag(x, y){
  const K = MAG_ZOOM, MR = MAG_R, LIM = 223;
  // place the loupe above the finger, flip below if too close to the top edge
  let my = y - MAG_LIFT, mx = x;
  if (my - MR < -LIM) my = y + MAG_LIFT;
  mx = Math.max(-LIM+MR, Math.min(LIM-MR, mx));
  my = Math.max(-LIM+MR, Math.min(LIM-MR, my));

  clipC.setAttribute('cx', mx); clipC.setAttribute('cy', my);
  magBg.setAttribute('cx', mx); magBg.setAttribute('cy', my);
  magRing.setAttribute('cx', mx); magRing.setAttribute('cy', my);
  magInner.setAttribute('transform', `translate(${mx - K*x},${my - K*y}) scale(${K})`);
  magCrossA.setAttribute('x1', mx-13); magCrossA.setAttribute('y1', my);
  magCrossA.setAttribute('x2', mx+13); magCrossA.setAttribute('y2', my);
  magCrossB.setAttribute('x1', mx); magCrossB.setAttribute('y1', my-13);
  magCrossB.setAttribute('x2', mx); magCrossB.setAttribute('y2', my+13);

  const sc = scoreAt(x, y);
  magLabel.textContent = sc.label;
  const w = Math.max(92, magLabel.textContent.length * 14 + 24);
  const ly = my - MR - 22;
  magLabel.setAttribute('x', mx); magLabel.setAttribute('y', ly);
  magLabelBg.setAttribute('x', mx - w/2); magLabelBg.setAttribute('y', ly - 17);
  magLabelBg.setAttribute('width', w); magLabelBg.setAttribute('height', 34);

  liveDot.setAttribute('cx', x); liveDot.setAttribute('cy', y);
  magG.setAttribute('display', '');
}
function hideMag(){ magG.setAttribute('display','none'); }

svg.addEventListener('pointerdown', e=>{
  if (S.over) return;
  aiming = true;
  try{ svg.setPointerCapture(e.pointerId); }catch(err){}
  const {x,y} = toSvg(e);
  showMag(x,y);
  e.preventDefault();
});
svg.addEventListener('pointermove', e=>{
  if (!aiming) return;
  const {x,y} = toSvg(e);
  showMag(x,y);
  e.preventDefault();
});
function finish(e){
  if (!aiming) return;
  aiming = false;
  hideMag();
  const {x,y} = toSvg(e);
  if (Math.hypot(x,y) > 300) return;              // released well off the board: ignore
  const sc = scoreAt(x,y);
  fx.tick();                 // board taps bypass onPress, so cue them here
  // sector is 1..20 for the numbered beds, 25 for either bull, 0 for a miss
  throwDart({short:sc.short, value:sc.value, label:sc.label, base:sc.sector, mult:sc.mult,
             x:+x.toFixed(1), y:+y.toFixed(1)});
}
svg.addEventListener('pointerup', finish);
svg.addEventListener('pointercancel', ()=>{ aiming=false; hideMag(); });

function renderMarkers(){
  while (markerG.firstChild) markerG.removeChild(markerG.firstChild);

  });
}

function renderTurnbar(){
  const who = $('whoseTurn'), slots = $('dartSlots');
  who.innerHTML = ''; slots.innerHTML = '';
  if (S.over || !S.players.length){
    who.textContent = S.players.length ? 'Game over' : 'No players';
  } else {
    const p = S.players[S.cur];
    const live = p.total + S.darts.reduce((a,d)=>a+d.value,0);
    const nm = document.createElement('span'); nm.className='nm'; nm.textContent = p.name;
    const tg = document.createElement('span'); tg.className='togo';

    const d = S.darts[i];

    s.className = 'slot' + (d ? ' filled' : '');
    s.textContent = d ? d.short : '–';
    if (d && d.short !== '–' && d.short !== 'BULL' && d.short !== '25' && /^[TD]/.test(d.short)){
      s.innerHTML = `<span class="mult">${d.short[0]}</span>${d.short.slice(1)}`;
    }

function renderTable(){
  const t = $('sb');
  // wiping the table collapses the scroll container and the browser clamps it back to the
  // top, so hold the position and put it back once the rows are rebuilt
  const scBox = $('sbScroll');
  const keepTop = scBox ? scBox.scrollTop : 0, keepLeft = scBox ? scBox.scrollLeft : 0;
  t.innerHTML = '';
  // Columns share the width evenly, but never squeeze below something readable —
  // past that the scoreboard scrolls sideways instead of mangling names and totals.
  // 158px x 3 + the turn column fits inside the 540px sidebar, so three players
  // are always fully visible without scrolling.
  t.style.minWidth = (44 + S.players.length * 158) + 'px';
  const maxTurns = Math.max(0, ...S.players.map(p=>p.history.length));
  const liveRow = (!S.over && S.players[S.cur]) ? S.players[S.cur].history.length : -1;
  const rows = Math.max(maxTurns, liveRow + 1);

  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  const th0 = document.createElement('th'); th0.className='turncol'; th0.textContent='#';
  hr.appendChild(th0);

  S.players.forEach((p, idx)=>{
    const th = document.createElement('th');
    if (!S.over && idx === S.cur) th.className = 'active';
    const box = document.createElement('div'); box.className='phead';

    const top = document.createElement('div'); top.className='phead-top';
    const inp = document.createElement('input');
    inp.className='pname'; inp.value=p.name; inp.spellcheck=false;
    inp.addEventListener('change', ()=>{ p.name = inp.value.trim() || defaultName(idx); save(); render(); });
    inp.addEventListener('keydown', e=>{ if (e.key==='Enter') inp.blur(); });
    top.appendChild(inp);
    if (S.players.length > 1){
      const x = document.createElement('button');
      x.className='px'; x.textContent='×'; x.title='Remove player';
      onPress(x, ()=>{
        if (!confirm(`Remove ${p.name}?`)) return;
        snapshot();
        S.players.splice(idx,1);
        if (S.cur >= S.players.length) S.cur = 0;
        if (S.players[S.cur] && S.players[S.cur].place){ const n=nextIndex(S.cur); if (n!==-1) S.cur=n; }
        S.over = S.players.length ? !S.players.some(q=>!q.place) : false;
        save(); render();
      });
      top.appendChild(x);
    }
    box.appendChild(top);

    const tot = document.createElement('div'); tot.className='ptotal'; tot.textContent = p.total;
    box.appendChild(tot);
    const sub = document.createElement('div');
    const inHand = (!S.over && idx === S.cur) ? S.darts.reduce((a,d)=>a+d.value,0) : 0;
    if (p.place){ sub.className='place'; sub.textContent = `🏁 ${ordinal(p.place)}`; }
    else if (S.darts.length && idx === S.cur && !S.over){
      sub.className='ptogo';
      sub.textContent = `+${inHand} → needs ${S.target - p.total - inHand}`;
    }
    else { sub.className='ptogo'; sub.textContent = `needs ${S.target - p.total}`; }
    box.appendChild(sub);

    th.appendChild(box);
    hr.appendChild(th);
  });
  thead.appendChild(hr); t.appendChild(thead);

  const tb = document.createElement('tbody');
  for (let r=0;r<rows;r++){
    const tr = document.createElement('tr');
    const td0 = document.createElement('td'); td0.className='turncol'; td0.textContent = r+1;
    tr.appendChild(td0);

    S.players.forEach((p, idx)=>{
      const td = document.createElement('td'); td.className='cell';
      const h = p.history[r];
      if (h){
        const line = document.createElement('div'); line.className='turncell';
        const sc = document.createElement('span');
        sc.className = 'tscore ' + (h.bust ? 'bust' : (h.score>0 ? 'pos' : ''));
        sc.textContent = h.bust ? 'BUST' : '+'+h.score;
        const run = document.createElement('span'); run.className='trun'; run.textContent = h.total;
        line.append(sc, run);
        td.appendChild(line);
        if (h.darts.length){
          const dd = document.createElement('div'); dd.className='tdarts';
          dd.textContent = h.darts.map(d=>d.short).join(' · ');
          td.appendChild(dd);
        }
      } else if (!S.over && !p.place && idx === S.cur && r === p.history.length){
        tr.classList.add('live');
        const line = document.createElement('div'); line.className='turncell';
        const sc = document.createElement('span'); sc.className='tscore pos';
        const g = S.darts.reduce((a,d)=>a+d.value,0);
        sc.textContent = S.darts.length ? '+'+g : '';
        const run = document.createElement('span'); run.className='livedots';
        run.textContent = '▸ throwing';
        line.append(sc, run);
        td.appendChild(line);
        if (S.darts.length){
          const dd = document.createElement('div'); dd.className='tdarts';
          dd.textContent = S.darts.map(d=>d.short).join(' · ');
          td.appendChild(dd);
        }
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  if (scBox){ scBox.scrollTop = keepTop; scBox.scrollLeft = keepLeft; }
  $('turnCount').textContent = maxTurns ? `${maxTurns} turn${maxTurns>1?'s':''}` : '';
}

function ordinal(n){ return n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th'); }

function renderBanner(){
  const b = $('banner');
  if (!S.over || !S.players.length){ b.className=''; b.innerHTML=''; return; }
  const ranked = S.players.slice().sort((a,b2)=>(a.place||99)-(b2.place||99));
  b.className = 'on';
  b.innerHTML = `<h2>🏆 Game over — everyone reached ${S.target}</h2><ol>` +
    ranked.map(p=>`<li><b>${escapeHtml(p.name)}</b> — ${p.history.length} turns</li>`).join('') +
    `</ol>`;
}

// Keep the turn being thrown in view: down as the rows pile up, and sideways to the
// active player's column when there are more players than fit.
function scrollLiveIntoView(){
  const sc = $('sbScroll');
  if (!sc) return;
  const scR = sc.getBoundingClientRect();
  const row = sc.querySelector('tr.live') || sc.querySelector('tbody tr:last-child');
  if (row){
    const head = sc.querySelector('thead');
    const headH = head ? head.getBoundingClientRect().height : 0;
    const r = row.getBoundingClientRect();
    if (r.bottom > scR.bottom)            sc.scrollTop += r.bottom - scR.bottom;
    else if (r.top < scR.top + headH)     sc.scrollTop -= (scR.top + headH) - r.top;
  }
  const col = sc.querySelector('thead th.active');
  if (col){
    const c = col.getBoundingClientRect();
    if (c.right > scR.right)      sc.scrollLeft += c.right - scR.right;
    else if (c.left < scR.left)   sc.scrollLeft -= scR.left - c.left;
  }
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let toastTimer=null;
function toast(msg, kind){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (kind ? ' '+kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className=''; }, kind ? 2200 : 1100);
}

function render(){
  $('targetSel').value = String(S.target);
  renderMarkers();
  renderTurnbar();
  renderTable();
  renderBanner();
  renderKeypad();
  scrollLiveIntoView();
}

/* ============================ controls ============================ */
/* ============================ feedback ============================ */
/* Sound and vibration on every press, so a registered press is obvious without looking.
   Vibration is Android/Chrome only — iPad Safari has no web haptics at all, which is
   exactly why the sound matters there. Tones are synthesised, so there are no assets. */
const SND_KEY = KEY + '-sound';
let soundOn = (()=>{ try{ return localStorage.getItem(SND_KEY) !== 'off'; }catch(e){ return true; } })();
let actx = null;

function audioCtx(){
  if (!soundOn) return null;
  try{
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    // iOS starts the context suspended; a press is a user gesture, so this is the moment
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(freq, dur, type, gain, delay){
  const a = audioCtx(); if (!a) return;
  const t0 = a.currentTime + (delay || 0);
  const osc = a.createOscillator(), g = a.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain == null ? 0.16 : gain, t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(a.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function buzz(pattern){
  if (!soundOn) return;
  try{ if (navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
const fx = {
  tick(){ tone(1200, 0.03, 'square', 0.14); buzz(12); },                 // press registered
  nope(){ tone(150, 0.07, 'sine', 0.12); },                              // pressed something dead
  bust(){ tone(330, 0.10, 'sawtooth', 0.18);
          tone(190, 0.18, 'sawtooth', 0.18, 0.09); buzz([0,45,55,45]); },
  win(){ [880,1175,1568].forEach((f,i)=> tone(f, 0.12, 'triangle', 0.17, i*0.085));
         buzz([0,25,45,25,45,80]); }
};

/* ============================ press handling ============================ */
/* A `click` only fires if the press and the release land on the same element without
   much movement. Stabbing at a tablet drags a few pixels constantly, so clicks get
   cancelled and the press silently does nothing. Everything here fires on pointerdown
   instead: the moment your finger lands, the action is committed and the button flashes,
   and it stays committed however far the finger slides afterwards. */
function flash(el){
  clearTimeout(el._hitT);
  el.classList.add('hit');
  el._hitT = setTimeout(()=>el.classList.remove('hit'), 170);
}
function onPress(el, fn){
  if (!el) return;
  el.addEventListener('pointerdown', e=>{
    if (e.pointerType === 'mouse' && e.button !== 0) return;   // ignore right/middle
    e.preventDefault();          // also suppresses the follow-up click, so no double fire
    if (el.disabled){ fx.nope(); return; }   // a dead key should still say something
    flash(el); fx.tick();
    fn();
  });
  // keyboard and assistive activation arrive as a click with no pointer detail
  el.addEventListener('click', e=>{
    if (e.detail === 0 && !el.disabled){ flash(el); fx.tick(); fn(); }
  });
}

/* ============================ keypad ============================ */
/* Same scoring vocabulary as the board, entered by hand. Press the number — that
   scores the single straight away — then ×2 or ×3 upgrades the dart you just
   entered. Nothing to arm beforehand, and nothing to remember to turn off. */
const MODE_KEY = KEY + '-mode';
let uiMode = (()=>{ try{ return localStorage.getItem(MODE_KEY) === 'keypad' ? 'keypad' : 'board'; }
                    catch(e){ return 'board'; } })();

const kpMult = $('kpMult'), kpNums = $('kpNums'), kpBull = $('kpBull');

function kpButton(parent, cls){
  const b = document.createElement('button');
  b.className = 'kp' + (cls ? ' ' + cls : '');
  b.type = 'button';
  parent.appendChild(b);
  return b;
}
// `reserveSub` keeps the third line's box even when there is nothing to put in it. Without
// it, entering a number gives x2/x3 a sub-line, the row grows, the number grid shrinks to
// compensate, and the whole keypad jumps a couple of pixels under your finger.
function fill(b, big, sub, lbl, reserveSub){
  b.innerHTML = '';
  if (lbl){ const d=document.createElement('div'); d.className='lbl'; d.textContent=lbl; b.appendChild(d); }
  const d=document.createElement('div'); d.className='big'; d.textContent=big; b.appendChild(d);
  if (sub || reserveSub){
    const s=document.createElement('div'); s.className='sub';
    s.textContent = sub || ' ';
    if (!sub) s.style.visibility = 'hidden';
    b.appendChild(s);
  }
}

const numBtns = [];
for (let n=1;n<=20;n++){
  const b = kpButton(kpNums);
  onPress(b, ()=> throwDart({short:String(n), value:n, base:n, mult:1, label:`${n}`}));
  numBtns.push(b);
}
const ringBtn = kpButton(kpBull, 'ring');
const bullBtn = kpButton(kpBull, 'bull');
const kpMissBtn = kpButton(kpBull);
onPress(ringBtn,   ()=> throwDart({short:'25',   value:25, base:25, mult:1, label:'25'}));
onPress(bullBtn,   ()=> throwDart({short:'BULL', value:50, base:25, mult:2, label:'BULL 50'}));
onPress(kpMissBtn, ()=> throwDart({short:'–',    value:0,  base:0,  mult:1, label:'MISS 0'}));

const multBtns = [2,3].map(m=>{
  const b = kpButton(kpMult);
  onPress(b, ()=> applyMult(m));
  return b;
});

function renderKeypad(){
  numBtns.forEach((b,i)=>{ fill(b, i+1); b.disabled = S.over; });
  fill(ringBtn,   '25', '', 'outer bull');
  fill(bullBtn,   '50', '', 'bullseye');
  fill(kpMissBtn, '0',  '', 'miss');
  [ringBtn,bullBtn,kpMissBtn].forEach(b=> b.disabled = S.over);

  // greyed out until a numbered bed has been entered — never for the bull or a miss
  const can = canUpgrade();
  // once a third dart has committed the turn, say whose dart x2/x3 would still rewrite
  const other = can && S.last.by !== S.cur && S.players[S.last.by];
  multBtns.forEach((b,i)=>{
    const m = i+2;
    const sub = !can ? ''
      : (other ? `${other.name} ${S.last.base} → ${S.last.base*m}`
               : `${S.last.base} → ${S.last.base*m}`);
    fill(b, '×'+m, sub, m===3 ? 'treble' : 'double', true);   // reserve the line either way
    b.disabled = !can;
  });
}

function applyMode(){
  document.body.classList.toggle('mode-keypad', uiMode === 'keypad');
  $('modeBtn').textContent = uiMode === 'keypad' ? '🎯 Board' : '⌨ Keypad';
  $('modeBtn').title = uiMode === 'keypad' ? 'Switch back to tapping the board'
                                           : 'Switch to entering scores by number';
}
onPress($('modeBtn'), ()=>{
  uiMode = uiMode === 'keypad' ? 'board' : 'keypad';
  try{ localStorage.setItem(MODE_KEY, uiMode); }catch(e){}

});

/* ---- sound / vibration toggle ---- */
const soundBtn = $('soundBtn');
function syncSound(){
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.title = soundOn ? 'Sound and vibration on — tap to silence'
                           : 'Silent — tap for sound and vibration';

/* ---- full screen ---- */
const fsBtn = $('fullBtn');
const fsEl  = ()=> document.fullscreenElement || document.webkitFullscreenElement || null;
const fsCan = ()=> !!(document.documentElement.requestFullscreen ||
                      document.documentElement.webkitRequestFullscreen);
const standalone = window.matchMedia('(display-mode: standalone)').matches ||
                   window.matchMedia('(display-mode: fullscreen)').matches ||
                   navigator.standalone === true;

function syncFs(){
  document.body.classList.toggle('isFull', !!fsEl());
  fsBtn.textContent = fsEl() ? '⤡ Exit full screen' : '⛶ Full screen';
}
// iPhone/iPad Safari has no fullscreen API for pages, and some embedded browsers
// refuse the request — either way, point at the home-screen route instead of doing nothing.
const fsTip = ()=> toast('Add this page to your home screen for full screen', 'win');

onPress(fsBtn, ()=>{
  const el = document.documentElement;
  if (fsEl()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (!fsCan()){ fsTip(); return; }
  try{
    const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    if (p && p.catch) p.catch(fsTip);
  }catch(e){ fsTip(); }
});
document.addEventListener('fullscreenchange', syncFs);
document.addEventListener('webkitfullscreenchange', syncFs);
if (standalone) fsBtn.style.display = 'none';   // already launched chrome-less
syncFs();

onPress($('missBtn'), ()=> throwDart({short:'–', value:0, base:0, mult:1, label:'MISS 0'}));
onPress($('endTurn'), endTurn);
onPress($('undo'), undo);

onPress($('addPlayer'), ()=>{
  snapshot();
  S.players.push(newPlayer(defaultName(S.players.length)));
  if (S.over){ S.over = false; if (S.players[S.cur] && S.players[S.cur].place) S.cur = S.players.length-1; }
  save(); render();
});

onPress($('newGame'), ()=>{
  if (S.players.some(p=>p.history.length) && !confirm('Start a new game? Scores are cleared, names are kept.')) return;
  snapshot();
  S = freshGame(S.players.map(p=>p.name), S.target);
  save(); render();
});


$('targetSel').addEventListener('change', e=>{
  snapshot();
  S.target = parseInt(e.target.value, 10);
  S.players.forEach(p=>{ if (p.total > S.target) p.total = 0; p.place = null; });
  S.over = false;
  save(); render();
});

document.addEventListener('keydown', e=>{
  if (e.target.tagName === 'INPUT') return;
  if ((e.key === 'z' && (e.metaKey || e.ctrlKey)) || e.key === 'Backspace'){ e.preventDefault(); undo(); }
  if (e.key === 'Enter'){ e.preventDefault(); endTurn(); }
});

load();
render();
})();
</script>
</body>
</html>
